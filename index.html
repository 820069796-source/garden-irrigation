<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能浇水系统</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
    padding:15px;
}
.card{
    background:#fff;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.value{
    font-size:26px;
    font-weight:bold;
}
.online{color:#00aa00;}
.offline{color:red;}
</style>
</head>

<body>

<h2>🌱 智能浇水远程监控</h2>

<div class="card">
    <div>设备状态</div>
    <div id="status" class="value offline">OFFLINE</div>
</div>

<div class="card">
    <div>空气温度</div>
    <div id="temp" class="value">-- ℃</div>
</div>

<div class="card">
    <div>空气湿度</div>
    <div id="hum" class="value">-- %RH</div>
</div>

<div class="card">
    <div>WiFi 信号</div>
    <div id="rssi" class="value">-- dBm</div>
</div>

<div class="card">
    <div style="font-size:20px;font-weight:bold;margin-bottom:12px;">
        1区
    </div>

    <div>
        实际状态：
        <span id="zone1Status" class="offline">停止</span>
    </div>

    <div style="margin-top:10px;">
        土壤湿度：
        <span id="zone1Soil" style="font-weight:bold;">--.-</span> %
    </div>

    <div style="margin-top:10px;">
        探头状态：
        <span id="zone1SoilStatus" class="offline">OFFLINE</span>
    </div>
</div>
    
<script>
const client = mqtt.connect(
    "wss://broker.emqx.io:8084/mqtt"
);

client.on("connect", () => {
document.getElementById("status").innerText = "MQTT已连接";
    client.subscribe("garden/irrigation/system/status");
    client.subscribe("garden/irrigation/environment/temperature");
    client.subscribe("garden/irrigation/environment/humidity");
    client.subscribe("garden/irrigation/system/rssi");
    client.subscribe("garden/irrigation/zone1/status");
client.subscribe("garden/irrigation/zone1/soil");
client.subscribe("garden/irrigation/zone1/soilstatus");
});

client.on("error", (err) => {
    console.log("MQTT WebSocket 错误:", err);
});

client.on("close", () => {
    console.log("MQTT WebSocket 已断开");
});
    
client.on("message", (topic, msg) => {

    const value = msg.toString();

    if(topic === "garden/irrigation/system/status"){
        const el = document.getElementById("status");
        el.innerText = value;

        if(value === "ONLINE")
            el.className = "value online";
        else
            el.className = "value offline";
    }

    if(topic === "garden/irrigation/environment/temperature")
        document.getElementById("temp").innerText = value + " ℃";

    if(topic === "garden/irrigation/environment/humidity")
        document.getElementById("hum").innerText = value + " %RH";

    if(topic === "garden/irrigation/system/rssi")
        document.getElementById("rssi").innerText = value + " dBm";
    // ===== 1区实际运行状态 =====
if(topic === "garden/irrigation/zone1/status"){
    const el = document.getElementById("zone1Status");

    if(value === "ON"){
        el.innerText = "运行";
        el.className = "online";
    }else{
        el.innerText = "停止";
        el.className = "offline";
    }
}

// ===== 1区土壤湿度 =====
if(topic === "garden/irrigation/zone1/soil"){
    document.getElementById("zone1Soil").innerText = value;
}

// ===== 1区土壤探头状态 =====
if(topic === "garden/irrigation/zone1/soilstatus"){
    const el = document.getElementById("zone1SoilStatus");

    el.innerText = value;

    if(value === "ONLINE")
        el.className = "online";
    else
        el.className = "offline";
}
});
</script>

</body>
</html>
