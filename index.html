<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花园智能浇水</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial,"Microsoft YaHei",sans-serif;color:#222}
.page{max-width:520px;margin:auto;padding:18px 14px 34px}
h1{text-align:center;font-size:25px;margin:4px 0 24px}
.section-title{font-size:17px;font-weight:700;margin:18px 2px 10px}
.box,.zone-card,.env-card,.other-card{background:#fff;border-radius:12px;box-shadow:0 2px 9px rgba(0,0,0,.07)}
.box{padding:14px 16px}
.mode{font-size:18px;font-weight:700}
.green{color:#18a83a}.blue{color:#2196f3}.gray{color:#999}.red{color:#e53935}
.zone-card{display:none;margin:10px 0;padding:15px;border-left:5px solid #4caf50}
.zone-grid{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:18px}
.zone-title{font-size:18px;font-weight:700;margin-bottom:10px}
.zone-status{font-size:14px;margin-bottom:10px}
.meta{font-size:13px;color:#777;line-height:1.65}
.soil-title{font-size:14px;font-weight:700}
.soil-status{font-size:13px;margin-top:5px}
.soil-value{font-size:24px;font-weight:700;margin-top:5px}
.bar{height:7px;background:#e7e7e7;border-radius:8px;overflow:hidden;margin-top:7px}
.bar-fill{height:100%;width:0;background:#18a83a;border-radius:8px;transition:width .35s}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.env-card{padding:14px 12px;display:flex;align-items:center;gap:10px}
.env-icon{font-size:27px}.env-name{font-size:12px;color:#777;margin-bottom:4px}.env-value{font-size:20px;font-weight:700}
.other-card{padding:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:10px;background:#2196f3;color:#fff;font-size:16px;text-decoration:none;font-weight:600}
.signal{margin-top:10px;text-align:center;color:#666;font-size:13px}
.footer{text-align:center;color:#999;font-size:12px;margin-top:18px}
@media(max-width:380px){.zone-grid{grid-template-columns:minmax(0,1fr) 125px;gap:10px}.page{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="page">
<h1>🌱 花园智能浇水</h1>

<div class="section-title">运行模式</div>
<div class="box"><div id="plcMode" class="mode"><span class="gray">●</span> 模式读取中...</div></div>

<div class="section-title">浇水区域</div>
<div id="zones"></div>

<div class="section-title">空气温湿度</div>
<div class="env-grid">
  <div class="env-card"><div class="env-icon">🌡️</div><div><div class="env-name">空气温度</div><div class="env-value"><span id="airTemp">--.-</span>℃</div></div></div>
  <div class="env-card"><div class="env-icon">💧</div><div><div class="env-name">空气湿度</div><div class="env-value"><span id="airHumidity">--.-</span>%</div></div></div>
</div>

<div class="section-title">其它</div>
<div class="other-card">
  <a class="btn" href="history.html">💧 查看土壤浇水记录</a>
  <div class="signal">📶 WiFi 信号：<strong id="rssi">--</strong> dBm</div>
</div>

<div id="mqttState" class="footer">正在连接远程设备...</div>
</div>

<script>
const zones=document.getElementById("zones");
for(let i=1;i<=8;i++){
  zones.insertAdjacentHTML("beforeend",`
  <div class="zone-card" id="zoneCard${i}">
    <div class="zone-grid">
      <div>
        <div class="zone-title">区域 ${i}</div>
        <div class="zone-status">实际状态：<span id="zoneStatus${i}" class="gray">● 读取中</span></div>
        <div class="meta">上次时间：<span id="zoneLastTime${i}">--</span><br>上次水量：<span id="zoneLastWater${i}">--</span> L</div>
      </div>
      <div>
        <div class="soil-title">土壤湿度</div>
        <div id="zoneSoilStatus${i}" class="soil-status gray">● 读取中</div>
        <div class="soil-value"><span id="zoneSoil${i}">--.-</span>%</div>
        <div class="bar"><div id="zoneSoilBar${i}" class="bar-fill"></div></div>
      </div>
    </div>
  </div>`);
}

const client=mqtt.connect("wss://broker.emqx.io:8084/mqtt",{reconnectPeriod:3000,connectTimeout:10000});
client.on("connect",()=>{
  document.getElementById("mqttState").innerText="远程数据已连接";
  ["garden/irrigation/system/status","garden/irrigation/system/mode","garden/irrigation/system/rssi",
   "garden/irrigation/environment/temperature","garden/irrigation/environment/humidity"].forEach(t=>client.subscribe(t));
  for(let i=1;i<=8;i++)["status","soil","soilstatus","lasttime","lastwater","enabled"].forEach(x=>client.subscribe(`garden/irrigation/zone${i}/${x}`));
});
client.on("close",()=>document.getElementById("mqttState").innerText="远程数据连接断开，正在重连...");
client.on("error",()=>document.getElementById("mqttState").innerText="远程数据连接异常");

client.on("message",(topic,message)=>{
  const value=message.toString().trim();

  if(topic==="garden/irrigation/system/mode"){
    const e=document.getElementById("plcMode");
    if(value==="MANUAL") e.innerHTML='<span class="blue">●</span> 手动模式';
    else if(value==="AUTO") e.innerHTML='<span class="green">●</span> 自动模式';
    else e.innerHTML='<span class="gray">●</span> 模式未知';
    return;
  }
  if(topic==="garden/irrigation/environment/temperature"){document.getElementById("airTemp").innerText=value;return}
  if(topic==="garden/irrigation/environment/humidity"){document.getElementById("airHumidity").innerText=value;return}
  if(topic==="garden/irrigation/system/rssi"){document.getElementById("rssi").innerText=value;return}

  const m=topic.match(/^garden\/irrigation\/zone([1-8])\/(status|soil|soilstatus|lasttime|lastwater|enabled)$/);
  if(!m)return;
  const z=m[1],type=m[2];

  if(type==="enabled"){document.getElementById(`zoneCard${z}`).style.display=value==="ENABLED"?"block":"none";return}
  if(type==="status"){
    const e=document.getElementById(`zoneStatus${z}`);
    if(value==="ON"){e.innerText="💧 浇水中";e.className="green"}else{e.innerText="● 停止";e.className="gray"}
    return;
  }
  if(type==="soil"){
    const n=parseFloat(value),ok=Number.isFinite(n);
    document.getElementById(`zoneSoil${z}`).innerText=ok?n.toFixed(1):"--.-";
    document.getElementById(`zoneSoilBar${z}`).style.width=(ok?Math.max(0,Math.min(100,n)):0)+"%";
    return;
  }
  if(type==="soilstatus"){
    const e=document.getElementById(`zoneSoilStatus${z}`);
    if(value==="ONLINE"){e.innerText="● 在线";e.className="soil-status green"}else{e.innerText="● 离线";e.className="soil-status red"}
    return;
  }
  if(type==="lasttime"){document.getElementById(`zoneLastTime${z}`).innerText=value;return}
  if(type==="lastwater"){document.getElementById(`zoneLastWater${z}`).innerText=value;return}
});
</script>
</body>
</html>
